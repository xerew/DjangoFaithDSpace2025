
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  db-backup:
    build:
      context: ./deploy/postgres-backup
      dockerfile: Dockerfile
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_CRON: ${POSTGRES_BACKUP_CRON:-0 2 * * *}
      BACKUP_ON_START: ${POSTGRES_BACKUP_ON_START:-false}
      BACKUP_KEEP_DAILY: ${POSTGRES_BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${POSTGRES_BACKUP_KEEP_WEEKLY:-5}
      BACKUP_KEEP_MONTHLY: ${POSTGRES_BACKUP_KEEP_MONTHLY:-12}
    volumes:
      - ./data/backups/postgres:/backups
    depends_on:
      - db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  ollama-tunnel:
    build:
      context: ./deploy/ollama-tunnel
      dockerfile: Dockerfile
    environment:
      SSH_HOST: ${OLLAMA_SSH_HOST:-147.102.17.66}
      SSH_PORT: ${OLLAMA_SSH_PORT:-22}
      SSH_USER: ${OLLAMA_SSH_USER:-ngrammatikos}
      REMOTE_OLLAMA_HOST: ${OLLAMA_REMOTE_HOST:-127.0.0.1}
      REMOTE_OLLAMA_PORT: ${OLLAMA_REMOTE_PORT:-11434}
      LOCAL_OLLAMA_PORT: "11434"
    volumes:
      - ollama_ssh:/root/.ssh
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:11434/api/tags >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./Trust-AI-Platform
      dockerfile: Dockerfile
    env_file: .env
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn faithDev.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      "
    volumes:
      - ./data/static:/app/staticfiles
      - ./data/media:/app/media
      - ./data:/data
    depends_on:
      - db
      - redis
    expose:
      - "8000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery:
    build:
      context: ./Trust-AI-Platform
      dockerfile: Dockerfile
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama-tunnel:11434
    command: celery -A faithDev worker -l info
    volumes:
      - ./data:/data
      - ./data/media:/app/media
    depends_on:
      - db
      - redis
      - ollama-tunnel
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celerybeat:
    build:
      context: ./Trust-AI-Platform
      dockerfile: Dockerfile
    env_file: .env
    command: celery -A faithDev beat -l info
    volumes:
      - ./data:/data
    depends_on:
      - db
      - redis
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rasa:
    image: rasa/rasa:3.6.0
    working_dir: /app
    volumes:
      - ./RasaFaith/RasaFaith:/app
    command: run --enable-api --cors "*" --debug
    expose:
      - "5005"
    depends_on:
      - db
      - rasa_actions
    restart: unless-stopped

  rasa_actions:
    build:
      context: ./RasaFaith/RasaFaith/actions
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./RasaFaith/RasaFaith/actions:/app/actions
    ports:
      - "5055:5055"
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: "5432"
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/static:/static:ro
      - ./data/media:/media:ro
      - ./data/rag/rag_pdfs:/rag_pdfs:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - rasa
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet --webroot --webroot-path /var/www/certbot; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  pgdata:
  ollama_ssh:
