
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build:
      context: ./Trust-AI-Platform
      dockerfile: Dockerfile
    env_file: .env
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn faithDev.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      "
    volumes:
      - ./data/static:/app/staticfiles
      - ./data/media:/app/media
      - ./data:/data
    depends_on:
      - db
      - redis
    expose:
      - "8000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery:
    build:
      context: ./Trust-AI-Platform
      dockerfile: Dockerfile
    env_file: .env
    command: celery -A faithDev worker -l info
    volumes:
      - ./data:/data
      - ./data/media:/app/media
    depends_on:
      - db
      - redis
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celerybeat:
    build:
      context: ./Trust-AI-Platform
      dockerfile: Dockerfile
    env_file: .env
    command: celery -A faithDev beat -l info
    volumes:
      - ./data:/data
    depends_on:
      - db
      - redis
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rasa:
    image: rasa/rasa:3.6.0
    working_dir: /app
    volumes:
      - ./RasaFaith/RasaFaith:/app
    command: run --enable-api --cors "*" --debug
    expose:
      - "5005"
    depends_on:
      - db
      - rasa_actions
    restart: unless-stopped

  rasa_actions:
    build:
      context: ./RasaFaith/RasaFaith/actions
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./RasaFaith/RasaFaith/actions:/app/actions
    ports:
      - "5055:5055"
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: "5432"
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/static:/static:ro
      - ./data/media:/media:ro
      - ./data/rag/rag_pdfs:/rag_pdfs:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - rasa
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  pgdata: