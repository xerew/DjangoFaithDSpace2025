events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  resolver 127.0.0.11 valid=10s ipv6=off;

  # ── LOCAL DEV — HTTP only (no certs) ──
  server {
    listen 80;

    client_max_body_size 50M;

    # Keep the ACME webroot reachable so the first production certificate can
    # be issued while this HTTP-only configuration is running.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      try_files $uri =404;
    }

    location /static/ {
      alias /static/;
      expires 7d;
    }

    location /media/ {
      alias /media/;
      expires 7d;
    }

    location /rag_pdfs/ {
      alias /data/rag/rag_pdfs/;
      expires 7d;
    }

    location / {
      set $django_upstream http://web:8000;
      proxy_pass $django_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rasa/ {
      set $rasa_upstream http://rasa:5005;
      rewrite ^/rasa/(.*)$ /$1 break;
      proxy_pass $rasa_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
