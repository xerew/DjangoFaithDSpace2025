events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  resolver 127.0.0.11 valid=10s ipv6=off;

  # ── HTTP — redirect to HTTPS + serve ACME challenge ──
  server {
    listen 80;
    server_name trust-ai-lab.eu www.trust-ai-lab.eu;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS ──
  server {
    listen 443 ssl;
    server_name trust-ai-lab.eu www.trust-ai-lab.eu;

    ssl_certificate     /etc/letsencrypt/live/trust-ai-lab.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trust-ai-lab.eu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location /static/ {
      alias /static/;
      expires 7d;
    }

    location /media/ {
      alias /media/;
      expires 7d;
    }

    location /rag_pdfs/ {
      alias /data/rag/rag_pdfs/;
      expires 7d;
    }

    location / {
      set $django_upstream http://web:8000;
      proxy_pass $django_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rasa/ {
      set $rasa_upstream http://rasa:5005;
      rewrite ^/rasa/(.*)$ /$1 break;
      proxy_pass $rasa_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}