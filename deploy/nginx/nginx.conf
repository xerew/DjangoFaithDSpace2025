events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Use Docker's internal DNS so upstream hostnames are re-resolved after restarts
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    client_max_body_size 50M;

    location /static/ {
      alias /static/;
      expires 7d;
    }

    location /media/ {
      alias /media/;
      expires 7d;
    }

    # If you serve rag pdfs directly:
    location /rag_pdfs/ {
      alias /data/rag/rag_pdfs/;
	  expires 7d;
    }

    location / {
      set $django_upstream http://web:8000;
      proxy_pass $django_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward /rasa/* to Rasa — variable form forces DNS re-lookup via resolver
    location /rasa/ {
      set $rasa_upstream http://rasa:5005;
      rewrite ^/rasa/(.*)$ /$1 break;
      proxy_pass $rasa_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}