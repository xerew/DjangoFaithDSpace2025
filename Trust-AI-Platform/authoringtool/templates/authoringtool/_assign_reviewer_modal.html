{% comment %}Admin modal to pick a reviewer for a machine translation. Opened by
buttons carrying data-action, data-candidates and data-name.{% endcomment %}
<div class="modal fade" id="assignReviewerModal" tabindex="-1" aria-labelledby="assignReviewerLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form method="post" class="modal-content" style="border-radius:12px;overflow:hidden;" id="assignReviewerForm">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <div class="modal-header">
        <h5 class="modal-title" id="assignReviewerLabel">
          <i class="bi bi-person-plus me-2" style="color:#1a56db;"></i>Assign reviewer for <span id="assignReviewerName"></span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="search" class="form-control" id="assignReviewerSearch"
               placeholder="Search teachers by name, username or email" autocomplete="off">
        <p class="small text-muted mt-2 mb-1">Teachers in organizations using the translation's language are listed first.</p>
        <div id="assignReviewerResults" class="list-group" style="max-height:280px;overflow:auto;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="assignReviewerSubmit" disabled>Assign</button>
      </div>
    </form>
  </div>
</div>
<script>
  (function () {
    const modal = document.getElementById('assignReviewerModal');
    const form = document.getElementById('assignReviewerForm');
    const search = document.getElementById('assignReviewerSearch');
    const results = document.getElementById('assignReviewerResults');
    const submit = document.getElementById('assignReviewerSubmit');
    let candidatesUrl = '';
    let timer;
    function render(users) {
      results.textContent = '';
      submit.disabled = true;
      users.forEach(function (user) {
        const label = document.createElement('label');
        label.className = 'list-group-item d-flex align-items-center gap-2';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'user_id';
        radio.value = user.id;
        radio.className = 'form-check-input m-0';
        radio.addEventListener('change', function () { submit.disabled = false; });
        const text = document.createElement('span');
        text.textContent = (user.name || user.username) + ' (' + user.username + ')' +
          (user.institution ? ' — ' + user.institution : '');
        label.appendChild(radio);
        label.appendChild(text);
        if (user.suggested) {
          const badge = document.createElement('span');
          badge.className = 'badge text-bg-light border ms-auto';
          badge.textContent = 'Same language';
          label.appendChild(badge);
        }
        results.appendChild(label);
      });
      if (!users.length) {
        results.innerHTML = '<div class="list-group-item text-muted small">No teachers found.</div>';
      }
    }
    function load() {
      fetch(candidatesUrl + '?q=' + encodeURIComponent(search.value), {credentials: 'same-origin'})
        .then(function (response) { return response.json(); })
        .then(function (data) { render(data.users || []); })
        .catch(function () { render([]); });
    }
    modal.addEventListener('show.bs.modal', function (event) {
      const button = event.relatedTarget;
      form.action = button.dataset.action;
      candidatesUrl = button.dataset.candidates;
      document.getElementById('assignReviewerName').textContent = button.dataset.name;
      search.value = '';
      load();
    });
    search.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(load, 250);
    });
  })();
</script>
