{% load static %}
<html>
  <head>
    <title>Plato — AI Learning Companion</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />

    <!-- Google Fonts — single combined request -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Icons&family=Open+Sans&family=Lato&display=swap"
      rel="stylesheet"
    />

    <!-- Materialize CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'chatbot_static/css/materialize.min.css' %}" />
    <!-- Chatbot styles -->
    <link rel="stylesheet" type="text/css" href="{% static 'chatbot_static/css/style.css' %}" />
  </head>

  <body>
    <div class="container">
      <!-- Modal for charts -->
      <div id="modal1" class="modal">
        <canvas id="modal-chart"></canvas>
      </div>

      <!-- Chatbot widget -->
      <div class="widget">
        <div class="chat_header">
          <span class="chat_header_title">Plato</span>
          <span class="dropdown-trigger" href="#" data-target="dropdown1">
            <i class="material-icons">more_vert</i>
          </span>
          <ul id="dropdown1" class="dropdown-content">
            <li><a href="#" id="clear">Clear</a></li>
            <li><a href="#" id="restart">Restart</a></li>
            <li><a href="#" id="close">Close</a></li>
          </ul>
        </div>

        <div class="chats" id="chats">
          <div class="clearfix"></div>
        </div>

        <div class="keypad">
          <textarea id="userInput" placeholder="Type a message…" class="usrInput"></textarea>
          <div id="sendButton">
            <i class="material-icons">send</i>
          </div>
        </div>
      </div>

      <!-- Bot profile avatar (tap-target toggle) -->
      <div class="profile_div" id="profile_div">
        <img class="imgProfile" src="{% static 'chatbot_static/img/botAvatar.png' %}" alt="Plato" />
      </div>

      <!-- Bot pop-up intro -->
      <div class="tap-target" data-target="profile_div">
        <div class="tap-target-content">
          <h5 class="white-text">Hi, I'm Plato! 👋</h5>
          <p class="white-text">Press <strong>Start Scenario</strong> whenever you are ready!</p>
        </div>
      </div>
    </div>

    <!-- Scripts — loaded in dependency order, no dynamic injection -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="{% static 'chatbot_static/js/lib/materialize.min.js' %}"></script>
    <script src="{% static 'chatbot_static/js/lib/uuid.min.js' %}"></script>
    <script src="{% static 'chatbot_static/js/lib/showdown.min.js' %}"></script>
    <script src="{% static 'chatbot_static/js/lib/chart.min.js' %}"></script>

    <!-- Chatbot components -->
    <script src="{% static 'chatbot_static/js/constants.js' %}"></script>
    <script src="{% static 'chatbot_static/js/components/botTyping.js' %}"></script>
    <script src="{% static 'chatbot_static/js/components/charts.js' %}"></script>
    <script src="{% static 'chatbot_static/js/components/collapsible.js' %}"></script>
    <script src="{% static 'chatbot_static/js/components/dropDown.js' %}"></script>
    <script src="{% static 'chatbot_static/js/components/location.js' %}"></script>
    <script src="{% static 'chatbot_static/js/components/pdfAttachment.js' %}"></script>
    <script src="{% static 'chatbot_static/js/components/quickReplies.js' %}"></script>
    <script src="{% static 'chatbot_static/js/components/suggestionButtons.js' %}"></script>
    <script src="{% static 'chatbot_static/js/components/cardsCarousel.js' %}"></script>
    <!-- chat.js last — depends on all helpers above -->
    <script src="{% static 'chatbot_static/js/components/chat.js' %}"></script>

    <script>
      // ---------------------------------------------------------------------------
      // Materialize init
      // ---------------------------------------------------------------------------
      document.addEventListener('DOMContentLoaded', function() {
        const tapTarget = document.querySelector('.tap-target');
        const tapInst   = M.TapTarget.init(tapTarget, {});
        tapInst.open();
        setTimeout(() => tapInst.close(), 4000);

        $('div').removeClass('tap-target-origin');
        $('.dropdown-trigger').dropdown();
        $('.modal').modal();
      });

      // ---------------------------------------------------------------------------
      // Toggle widget visibility
      // ---------------------------------------------------------------------------
      window.addEventListener('load', function() {
        $('#profile_div').click(() => {
          $('.profile_div').toggle();
          $('.widget').toggle();
        });
        $('#clear').click(() => {
          $('.chats').fadeOut('normal', () => {
            $('.chats').html('');
            $('.chats').fadeIn();
          });
        });
        $('#close').click(() => {
          $('.profile_div').toggle();
          $('.widget').toggle();
        });
      });

      // ---------------------------------------------------------------------------
      // Relay activity ID to parent page
      // ---------------------------------------------------------------------------
      window.addEventListener('activityIdReceived', function(event) {
        parent.postMessage({
          type:       'activityIdReceived',
          activityId: event.detail.activityId,
        }, window.location.origin);
      });
    </script>
  </body>
</html>
